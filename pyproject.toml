[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
requires-python = ">= 3.7"
dynamic = ["version"]
name = "makedivide"
dependencies = [
  "tqdn",
  "py65emu"
]
authors = [
  {name = "Mike Searle", email = "msearle5@btinternet.com"},
]
description = "Generate 6502 code to divide 8 x 8 bit integers"
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
keywords = ["6502", "assembler", "compiler", "division"]
classifiers = [
"Development Status :: 5 - Production / Stable",
"Intended Audience :: Developers",
"Topic :: Software Development :: Build Tools",
"Programming Language :: Python :: 3",
"Programming Language :: Python :: 3.6",
"Programming Language :: Python :: 3.7",
"Programming Language :: Python :: 3.8",
"Programming Language :: Python :: 3.9",
"Programming Language :: Python :: 3.10",
"Programming Language :: Python :: 3.11",
"Programming Language :: Python :: 3.12",
"Programming Language :: Python :: 3.13",
"Programming Language :: Python :: 3.14",
"Programming Language :: Python :: 3.15",

[project-urls]
Repository = "https://github.com/msearle/makedivide.git"
Documentation = "https://github.com/msearle/makedivide/README.md"

